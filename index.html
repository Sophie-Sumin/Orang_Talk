<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>과제 도우미</title>
<style>
  :root {
    --ink: #1f2933;
    --soft: #5b6b7b;
    --line: #d7e3ee;
    --bg: #eef5fb;
    --blue: #1f6fb2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; background: #fff; }
  header { padding: 16px 20px; border-bottom: 1px solid var(--line); }
  header .eyebrow { font-size: 12px; color: var(--blue); margin: 0 0 4px; }
  header h1 { font-size: 17px; margin: 0; line-height: 1.4; }
  header p { font-size: 13px; color: var(--soft); margin: 6px 0 0; line-height: 1.6; }
  #gate { padding: 28px 20px; }
  #gate h2 { font-size: 16px; margin: 0 0 6px; }
  #gate p { font-size: 13px; color: var(--soft); line-height: 1.6; margin: 0 0 16px; }
  input, textarea {
    width: 100%; border: 1px solid #c3d2e0; border-radius: 10px;
    padding: 10px 12px; font: inherit; font-size: 15px; outline: none;
  }
  input:focus, textarea:focus { border-color: var(--blue); }
  .btn {
    border: 0; border-radius: 10px; background: var(--blue); color: #fff;
    padding: 11px 18px; font: inherit; font-size: 15px; cursor: pointer;
  }
  .btn:disabled { background: #b4c4d3; cursor: default; }
  #chat { flex: 1; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
  .bubble { max-width: 86%; padding: 11px 15px; border-radius: 16px; font-size: 15px; line-height: 1.65; white-space: pre-wrap; }
  .me { align-self: flex-end; background: var(--blue); color: #fff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: #f2f6fa; border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .bot.offtopic { background: #fdf6e7; border-color: #f0dfb0; }
  .bot.unsafe { background: #fdeeee; border-color: #f2c9c9; }
  .bot.help { background: #f3eefb; border-color: #ddd0f0; }
  .redo { align-self: flex-end; background: none; border: 0; color: #93a5b5; font: inherit; font-size: 12px; cursor: pointer; padding: 0; }
  .redo:hover { color: var(--blue); }
  .hint { align-self: flex-start; color: var(--soft); font-size: 13px; }
  .starters { display: flex; flex-wrap: wrap; gap: 8px; }
  .starters button { border: 1px solid var(--line); background: #f7fafd; color: var(--blue); border-radius: 999px; padding: 7px 13px; font: inherit; font-size: 13px; cursor: pointer; }
  footer { border-top: 1px solid var(--line); padding: 12px 20px 16px; }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  textarea { resize: none; }
  .note { margin: 9px 0 0; font-size: 12px; color: #93a5b5; }
  .who { font-size: 12px; color: var(--soft); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">오늘의 과제</p>
    <h1 id="taskTitle">불러오는 중</h1>
    <p id="taskDetail"></p>
  </header>

  <section id="gate">
    <h2>이름을 먼저 적어 주세요</h2>
    <p>선생님이 질문 기록을 볼 수 있어요. 로그인은 하지 않아도 됩니다.</p>
    <input id="nameInput" placeholder="예: 3반 12번 김하늘" autocomplete="off" />
    <div id="codeBox" style="display:none; margin-top:10px">
      <input id="codeInput" placeholder="수업 코드" autocomplete="off" />
    </div>
    <button class="btn" id="startBtn" style="margin-top:14px">시작하기</button>
  </section>

  <main id="chat" style="display:none">
    <div class="hint">과제에 대해 궁금한 것을 물어보세요. 답을 그대로 받아 쓰는 대신, 질문을 조금씩 고쳐 가며 물어보면 훨씬 좋은 답을 얻을 수 있어요.</div>
    <div class="starters" id="starters"></div>
  </main>

  <footer id="foot" style="display:none">
    <div class="row">
      <textarea id="input" rows="2" placeholder="과제에 대해 궁금한 점을 써 보세요"></textarea>
      <button class="btn" id="sendBtn">보내기</button>
    </div>
    <p class="note">과제와 관련된 질문에만 답해요. 주고받은 내용은 선생님이 볼 수 있어요. · <span class="who" id="who"></span></p>
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
let history = [];
let student = "";
let classCode = "";
let busy = false;

// 과제 정보와 수업 코드 사용 여부를 서버에서 받아옵니다.
fetch("/api/task").then(r => r.json()).then(cfg => {
  $("taskTitle").textContent = cfg.taskTitle;
  $("taskDetail").textContent = cfg.taskDetail;
  if (cfg.needCode) $("codeBox").style.display = "block";
  (cfg.starters || []).forEach(q => {
    const b = document.createElement("button");
    b.textContent = q;
    b.onclick = () => { $("input").value = q; $("input").focus(); };
    $("starters").appendChild(b);
  });
}).catch(() => { $("taskTitle").textContent = "과제를 불러오지 못했어요. 새로고침해 주세요."; });

const saved = localStorage.getItem("student");
if (saved) $("nameInput").value = saved;

$("startBtn").onclick = () => {
  const n = $("nameInput").value.trim();
  if (!n) { $("nameInput").focus(); return; }
  student = n;
  classCode = $("codeInput") ? $("codeInput").value.trim() : "";
  localStorage.setItem("student", n);
  $("who").textContent = n;
  $("gate").style.display = "none";
  $("chat").style.display = "flex";
  $("foot").style.display = "block";
  $("input").focus();
};

function bubble(text, cls, isMe) {
  const d = document.createElement("div");
  d.className = "bubble " + (isMe ? "me" : "bot " + (cls || ""));
  d.textContent = text;
  $("chat").appendChild(d);
  if (isMe) {
    const r = document.createElement("button");
    r.className = "redo";
    r.textContent = "이 질문 고쳐 쓰기";
    r.onclick = () => { $("input").value = text; $("input").focus(); };
    $("chat").appendChild(r);
  }
  $("chat").scrollTop = $("chat").scrollHeight;
  return d;
}

async function send() {
  const text = $("input").value.trim();
  if (!text || busy) return;
  busy = true;
  $("sendBtn").disabled = true;
  $("input").value = "";
  bubble(text, "", true);
  const wait = bubble("질문을 확인하고 있어요…", "", false);

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: student, text, history, code: classCode })
    });
    const data = await res.json();
    wait.remove();
    bubble(data.reply, data.verdict === "ok" ? "" : data.verdict, false);
    if (data.verdict === "ok") {
      history.push({ role: "user", content: text });
      history.push({ role: "assistant", content: data.reply });
      history = history.slice(-6);
    }
  } catch (e) {
    wait.remove();
    bubble("연결이 잠시 끊겼어요. 잠깐 기다렸다가 다시 보내 주세요.", "error", false);
  }
  busy = false;
  $("sendBtn").disabled = false;
  $("input").focus();
}

$("sendBtn").onclick = send;
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
</script>
</body>
</html>
